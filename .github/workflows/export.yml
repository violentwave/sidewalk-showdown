name: export

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Allow dry-running the export without pushing, e.g. from the Actions tab or
  # `gh workflow run export.yml`.
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight export; cancelling keeps the queue (and
# artifact storage) from filling with obsolete builds.
concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            preset: linux
            artifact: sidewalk-showdown-linux
            out: build/linux/sidewalk_showdown.x86_64
            dir: build/linux
          - name: Windows x64
            preset: windows
            artifact: sidewalk-showdown-windows
            out: build/windows/sidewalk_showdown.exe
            dir: build/windows
    steps:
      - uses: actions/checkout@v5

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The ~1 GB export templates do not fit this repository's Actions storage
      # budget: on the free plan the total is 500 MB, so caching the installed
      # templates (even as one entry) consumes the quota the build artifacts
      # need, and both upload steps then fail with "Artifact storage quota has
      # been hit". Download the templates per run instead — that is the only
      # step that gets slower, and it keeps exports publishable.
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path game --import

      - name: Export (${{ matrix.preset }})
        # Godot resolves a relative export path against the project directory
        # (--path game), so pass an absolute destination.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.dir }}"
          godot --headless --path game --export-release "${{ matrix.preset }}" \
            "$GITHUB_WORKSPACE/${{ matrix.out }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.sha.outputs.short }}
          path: ${{ matrix.dir }}
          if-no-files-found: error
          # Builds are ~50-60 MB per platform. A shorter window keeps the free
          # Actions storage budget below its 500 MB cap; anything older is
          # reproducible from its commit.
          retention-days: 14
