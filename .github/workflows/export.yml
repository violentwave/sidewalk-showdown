name: export

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Allow dry-running the export without pushing, e.g. from the Actions tab or
  # `gh workflow run export.yml`.
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            preset: linux
            artifact: sidewalk-showdown-linux
            out: build/linux/sidewalk_showdown.x86_64
            dir: build/linux
          - name: Windows x64
            preset: windows
            artifact: sidewalk-showdown-windows
            out: build/windows/sidewalk_showdown.exe
            dir: build/windows
    steps:
      - uses: actions/checkout@v5

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The ~1GB export templates only change when the Godot version does.
      # setup-godot caches its own download, but only in the runner's local tool
      # cache, which hosted runners do not keep between jobs — so keep the
      # installed templates in the Actions cache instead.
      - name: Cache Godot export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-${{ runner.os }}

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          # On a cache hit the templates are already restored into Godot's
          # export_templates directory, so skip the download.
          include-templates: ${{ steps.templates.outputs.cache-hit != 'true' }}

      - name: Import project
        run: godot --headless --path game --import

      - name: Export (${{ matrix.preset }})
        # Godot resolves a relative export path against the project directory
        # (--path game), so pass an absolute destination.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.dir }}"
          godot --headless --path game --export-release "${{ matrix.preset }}" \
            "$GITHUB_WORKSPACE/${{ matrix.out }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.sha.outputs.short }}
          path: ${{ matrix.dir }}
          if-no-files-found: error
          retention-days: 30
