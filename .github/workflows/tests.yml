name: tests

on:
  push:
  pull_request:
  # Allow re-running the suites on demand, e.g. from the Actions tab.
  workflow_dispatch:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path game --import
        timeout-minutes: 5
      - name: Combat tests
        run: godot --headless --path game --script res://tests/combat_test.gd
        timeout-minutes: 10
      - name: Round flow tests
        run: godot --headless --path game --script res://tests/round_flow_test.gd
        timeout-minutes: 5
      - name: Mode and character select tests
        run: godot --headless --path game --script res://tests/character_select_test.gd
        timeout-minutes: 5
      - name: Stage select and Gas-N-Go ambience tests
        run: godot --headless --path game --script res://tests/stage_select_test.gd
        timeout-minutes: 5
      - name: Stage floor guard tests
        run: godot --headless --path game --script res://tests/stage_floor_test.gd
        timeout-minutes: 5
      - name: Locomotion speed-parity tests
        run: godot --headless --path game --script res://tests/locomotion_speed_test.gd
        timeout-minutes: 5
      - name: CPU opponent tests
        run: godot --headless --path game --script res://tests/cpu_test.gd
        timeout-minutes: 10
      - name: Combo system tests
        run: godot --headless --path game --script res://tests/combo_test.gd
        timeout-minutes: 10
      - name: The Clip intro tests
        run: godot --headless --path game --script res://tests/the_clip_test.gd
        timeout-minutes: 5
      - name: Combo fuzz tests
        run: godot --headless --path game --script res://tests/combo_fuzz_test.gd
      - name: Stun and breaker tests
        run: godot --headless --path game --script res://tests/stun_breaker_test.gd
        timeout-minutes: 10
      - name: Combo adversarial tests
        run: godot --headless --path game --script res://tests/combo_adversarial_test.gd
        timeout-minutes: 5
      - name: Serialization tests
        run: godot --headless --path game --script res://tests/serialization_test.gd
        timeout-minutes: 5
      - name: B6 landing-whiff (superseded rule) tests
        run: godot --headless --path game --script res://tests/b6_landing_whiff_test.gd
        timeout-minutes: 5
      - name: UI flow (router, screens, pause) tests
        run: godot --headless --path game --script res://tests/ui_flow_test.gd
        timeout-minutes: 5
      - name: Settings persistence tests
        run: godot --headless --path game --script res://tests/settings_test.gd
        timeout-minutes: 5
      - name: UI asset size tests
        run: godot --headless --path game --script res://tests/ui_assets_test.gd
        timeout-minutes: 5

  air-probe:
    # Metrics only (docs/PROPOSALS.md section 3): the probe asserts nothing and
    # always exits 0, so this job can only fail if the probe stops running.
    # Kept as its own job so its runtime never gates the test suites.
    name: air probe (metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path game --import
        timeout-minutes: 5
      - name: Air balance probe
        run: godot --headless --path game --script res://tests/air_probe.gd
        timeout-minutes: 20
